name: Auto-Commit Daily

on:
  schedule:
    # Roda todo dia às 23:59 (horário UTC)
    # Ajuste o horário conforme necessário: https://crontab.guru
    - cron: '59 23 * * *'
  
  # Permite disparo manual via GitHub UI
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
      
      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit changes
        if: steps.verify-changed-files.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "chore: auto-commit daily changes [skip ci]"
      
      - name: Push changes
        if: steps.verify-changed-files.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

  # Job adicional: Verificar integridade
  validate:
    runs-on: ubuntu-latest
    needs: auto-commit
    if: always()
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      
      - name: Check structure
        run: |
          echo "✅ Verificando estrutura do repositório..."
          [ -f "README.md" ] && echo "✓ README.md" || echo "✗ README.md não encontrado"
          [ -f ".gitignore" ] && echo "✓ .gitignore" || echo "✗ .gitignore não encontrado"
          [ -d "docs" ] && echo "✓ docs/" || echo "✗ docs/ não encontrado"
          [ -d "scripts" ] && echo "✓ scripts/" || echo "✗ scripts/ não encontrado"
          [ -d "sql" ] && echo "✓ sql/" || echo "✗ sql/ não encontrado"
          [ -d "apex" ] && echo "✓ apex/" || echo "✗ apex/ não encontrado"
          echo "✅ Verificação concluída"
